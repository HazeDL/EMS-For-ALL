<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор баллов — EMS</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* --------- Левая панель --------- */
  .side-tabs-left {
    position: fixed; top: 50%; left: 0; transform: translateY(-50%);
    z-index: 90; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .tab-left {
    --visible: 56px; --width: 260px;
    position: relative;
    left: calc(-1 * (var(--width) - var(--visible)));
    width: var(--width); height: 62px;
    display: flex; align-items: center;
    gap: 14px; padding: 0 18px;
    background: rgba(22, 27, 34, 0.86); color: var(--text);
    border: 1px solid var(--border); border-left: none;
    border-radius: 0 14px 14px 0;
    font-size: 17px; font-weight: 500; text-align: left;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    transition: left 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.15s, color 0.15s, border-color 0.15s;
    pointer-events: auto; text-decoration: none;
  }
  .tab-left:hover {
    left: 0; background: rgba(30, 38, 52, 0.95);
    color: var(--accent-hover); border-color: var(--accent);
  }
  .tab-left .tab-icon { font-size: 24px; flex-shrink: 0; width: 30px; text-align: center; }
  .tab-left .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --------- Правая панель --------- */
  .side-tabs {
    position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    z-index: 90; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .tab {
    --visible: 52px; --width: 240px;
    position: relative; right: calc(-1 * (var(--width) - var(--visible)));
    width: var(--width); height: 62px; display: flex; align-items: center;
    gap: 14px; padding: 0 18px;
    background: rgba(22, 27, 34, 0.86); color: var(--text);
    border: 1px solid var(--border); border-right: none;
    border-radius: 14px 0 0 14px;
    font-size: 17px; font-weight: 500; text-align: left;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    transition: right 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.15s, color 0.15s, border-color 0.15s;
    pointer-events: auto; text-decoration: none;
  }
  .tab:hover {
    right: 0; background: rgba(30, 38, 52, 0.95);
    color: var(--accent-hover); border-color: var(--accent);
  }
  .tab.tab-active {
    background: rgba(26, 39, 68, 0.92);
    border-color: var(--accent); color: var(--accent);
  }
  .tab.tab-active::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
  }
  .tab-icon { font-size: 24px; flex-shrink: 0; width: 30px; text-align: center; }
  .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --------- Панель профиля --------- */
  .profile-bar {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  .profile-field {
    display: flex; flex-direction: column; gap: 5px;
    flex: 1; min-width: 200px;
  }
  .profile-field label {
    font-size: 12px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  }
  .profile-field select,
  .profile-field input {
    background: rgba(13, 17, 23, 0.7); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 16px; font-family: inherit;
    cursor: pointer; transition: border-color 0.15s;
  }
  .profile-field select:focus,
  .profile-field input:focus {
    outline: none; border-color: var(--accent);
  }
  .profile-actions { display: flex; gap: 8px; align-items: flex-end; }
  .dept-switch {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    padding: 4px 0; width: 100%;
    border-top: 1px solid var(--border);
    padding-top: 14px; margin-top: 4px;
  }
  .dept-switch-label {
    font-size: 12px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    font-weight: 600; margin-right: 8px;
  }
  .dept-btn {
    background: rgba(13, 17, 23, 0.6); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 20px; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dept-btn:hover { border-color: var(--accent); color: var(--accent); }
  .dept-btn.active {
    background: rgba(88, 166, 255, 0.12);
    border-color: var(--accent); color: var(--accent);
  }
  .btn-icon {
    width: 42px; height: 42px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: var(--bg-alt); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
  .btn-icon.danger:hover {
    border-color: var(--danger); color: var(--danger);
    background: rgba(248, 81, 73, 0.06);
  }

  /* --------- Модалка --------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9998;
    display: none; align-items: center; justify-content: center;
    background: rgba(5, 8, 12, 0.85);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 24px;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    max-width: 720px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.25s ease;
  }
  .modal-sm { max-width: 460px; }
  @keyframes modalIn {
    from { transform: scale(0.96); opacity: 0.8; }
    to   { transform: scale(1); opacity: 1; }
  }
  .modal-title {
    font-size: 22px; font-weight: 700; color: var(--accent);
    margin-bottom: 18px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .modal-close {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer; line-height: 1;
    padding: 0; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; transition: all 0.15s;
  }
  .modal-close:hover { color: var(--danger); background: rgba(248, 81, 73, 0.1); }

  .modal-message {
    font-size: 16px; color: var(--text); line-height: 1.6;
    margin-bottom: 22px;
  }
  .modal-buttons {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  }

  /* --------- Сводка --------- */
  .summary-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .summary-table th {
    text-align: left; padding: 12px 14px; color: var(--text-dim);
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .summary-table td {
    padding: 14px; border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .summary-table tr:hover td { background: rgba(88, 166, 255, 0.05); }
  .summary-table .num { text-align: right; font-weight: 700; color: var(--accent); }
  .summary-table .status { font-weight: 600; }
  .status-ok   { color: var(--success); }
  .status-low  { color: var(--gold); }
  .status-bad  { color: var(--danger); }

  /* --------- Секции калькулятора --------- */
  .section {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  }
  .section-title {
    font-size: 18px; font-weight: 600; color: var(--text);
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }

  .content-layout {
    display: grid; grid-template-columns: 130px 1fr;
    gap: 26px; align-items: start;
  }

  /* --------- Всплывающий тост при вводе --------- */
  .profile-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(26, 39, 68, 0.98);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    opacity: 0;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s;
    pointer-events: none;
    z-index: 3000;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 90vw;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .profile-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .profile-toast .pt-icon { font-size: 20px; }
  .profile-toast .pt-name { color: var(--accent); }
  .profile-toast .pt-total { color: var(--success); margin-left: 6px; }

  @media (max-width: 900px) {
    .content-layout { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .side-tabs-left { top: auto; bottom: 76px; left: 12px; transform: none; }
    .tab-left { --width: 220px; --visible: 52px; height: 54px; font-size: 16px; padding: 0 14px; left: 0; border-radius: 12px; border-left: 1px solid var(--border); }
    .side-tabs { top: auto; bottom: 14px; transform: none; }
    .tab { --width: 190px; --visible: 50px; height: 54px; font-size: 16px; padding: 0 14px; border-radius: 12px; border-right: 1px solid var(--border); right: 0; }
    .tab:hover { right: 0; }

    .profile-bar { padding: 14px 16px; gap: 10px; }
    .profile-field { min-width: 100%; }
    .profile-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
    .dept-btn { flex: 1; justify-content: center; padding: 9px 12px; font-size: 14px; }
    .dept-switch-label { width: 100%; margin: 0 0 6px 0; }
    .modal { padding: 20px; }
    .summary-table { font-size: 14px; }
    .summary-table th, .summary-table td { padding: 10px 8px; }

    .profile-toast { padding: 12px 18px; font-size: 15px; bottom: 90px; }
  }
</style>
</head>

</div>

<div class="container page-content">

  <header>

    </div>

  </div>

  <div class="content-layout" id="calc-area">

    <aside class="progress-rail" data-rail="main">
      <div class="progress-rail-title" id="rail-title">PSID</div>
      <div class="progress-rail-value" data-rail-value>0</div>
      <div class="progress-rail-scale">
        <div class="progress-rail-fill" data-rail-fill></div>
        <div class="progress-rail-ticks">
          <div class="progress-rail-tick" style="bottom: 100%;"><span class="progress-rail-tick-label">1500</span></div>
          <div class="progress-rail-tick" style="bottom: 66.66%;"><span class="progress-rail-tick-label">1000</span></div>

      </div>

    </aside>

  </div>

  <footer>

</div>

<!-- ==================== МОДАЛКА СВОДКИ ==================== -->
<div class="modal-overlay" id="modal-summary">
  <div class="modal">
    <div class="modal-title">

      <button class="modal-close" data-close="modal-summary" type="button">✕</button>
    </div>
    <div id="summary-content"></div>
  </div>
</div>

<!-- ==================== МОДАЛКА ПОДТВЕРЖДЕНИЯ ==================== -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-sm">
    <div class="modal-title">

    </div>
    <div class="modal-message" id="confirm-message">Вы уверены?</div>
    <div class="modal-buttons">
      <button class="primary" id="confirm-yes" type="button">Да</button>
      <button id="confirm-no" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- ==================== ТОСТ ПРИ ВВОДЕ ==================== -->
<div class="profile-toast" id="profile-toast">

<div class="toast" id="toast"></div>

const STORAGE_KEY = "ems_calc_profiles_v1";
const NORMS = { psid: 500, pm: 500, di: 500, had: 500 };

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let state = {
  profiles: [],
  activeProfileId: null
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed.profiles || !Array.isArray(parsed.profiles)) return false;
    state = parsed;
    return true;
  } catch (e) { return false; }
}

function newProfile(name, dept) {
  return {
    id: "p" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    name: name,
    dept: dept,
    data: {}
  };
}

function getActiveProfile() {
  return state.profiles.find(p => p.id === state.activeProfileId);
}

/* ============================================================
   МОДАЛКА ПОДТВЕРЖДЕНИЯ (замена confirm)
   ============================================================ */
let confirmCallback = null;

function askConfirm(message, onYes, yesLabel) {
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-yes").textContent = yesLabel || "Да";
  confirmCallback = onYes;
  document.getElementById("modal-confirm").classList.add("active");
}

function closeConfirm() {
  document.getElementById("modal-confirm").classList.remove("active");
  confirmCallback = null;
}

/* ============================================================
   ТОСТ ПРИ ВВОДЕ
   ============================================================ */
let profileToastTimer = null;

function showProfileToast() {
  const profile = getActiveProfile();
  if (!profile) return;
  const dept = DEPTS[profile.dept];
  const total = calcTotal(profile);

  document.getElementById("pt-name").textContent = profile.name + " · " + dept.title;
  document.getElementById("pt-total").textContent = total + " баллов";

  const el = document.getElementById("profile-toast");
  el.classList.add("show");
  clearTimeout(profileToastTimer);
  profileToastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ============================================================
   РАСЧЁТЫ
   ============================================================ */
function calcTotal(profile) {
  if (!profile) return 0;
  const dept = DEPTS[profile.dept];
  if (!dept) return 0;
  let total = 0;
  dept.sections.forEach(section => {
    if (section.actionMode) return;
    section.items.forEach(item => {
      const d = profile.data[item.key];
      if (!d) return;
      let count = d.count || 0;
      const point = d.point != null ? d.point : item.pts;
      if (item.lim > 0 && count > item.lim) count = item.lim;
      total += count * point;
    });
  });
  return total;
}

function calcInstrActions(profile) {
  if (!profile || profile.dept !== "di") return 0;
  const dept = DEPTS.di;
  const instr = dept.sections.find(s => s.actionMode);
  if (!instr) return 0;
  let actions = 0;
  instr.items.forEach(item => {
    const d = profile.data[item.key];
    if (!d) return;
    actions += d.count || 0;
  });
  return actions;
}

/* ============================================================
   ОТРИСОВКА ПАНЕЛИ ПРОФИЛЯ
   ============================================================ */
function renderProfileBar() {
  const sel = document.getElementById("profile-select");
  sel.innerHTML = "";
  state.profiles.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name + " (" + DEPTS[p.dept].title + ")";
    if (p.id === state.activeProfileId) opt.selected = true;
    sel.appendChild(opt);
  });

  const active = getActiveProfile();
  document.querySelectorAll(".dept-btn").forEach(btn => {
    btn.classList.toggle("active", active && btn.dataset.dept === active.dept);
  });
}

/* ============================================================
   ОТРИСОВКА КАЛЬКУЛЯТОРА
   ============================================================ */
function renderCalculator() {
  const profile = getActiveProfile();
  const body = document.getElementById("dept-body");
  const railTitle = document.getElementById("rail-title");
  body.innerHTML = "";

  if (!profile) {
    body.innerHTML = "<p style='color: var(--text-dim); text-align:center; padding: 40px 0;'>Нет активного профиля</p>";
    return;
  }

  const dept = DEPTS[profile.dept];
  railTitle.textContent = dept.title;

  dept.sections.forEach(section => {
    const sec = document.createElement("div");
    sec.className = "section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = section.title;
    sec.appendChild(title);

    const header = document.createElement("div");
    header.className = "row header-row";
    header.innerHTML = `
      <div class="cell">Действие</div>
      <div class="cell">Кол-во</div>
      <div class="cell">Балл</div>
      <div class="cell">Итог</div>`;
    sec.appendChild(header);

    section.items.forEach(item => {
      const d = profile.data[item.key] || {};
      const count = d.count != null ? d.count : "";
      const point = d.point != null ? d.point : item.pts;

      const row = document.createElement("div");
      row.className = "row";
      row.dataset.key = item.key;

      const badge = item.lim > 0 ? `<span class="limit">макс ${item.lim}</span>` : "";
      row.innerHTML = `
        <div class="name">${item.name}${badge}</div>
        <input type="number" min="0" step="1" value="${count}" data-role="count" data-key="${item.key}">
        <input type="number" min="0" step="1" value="${point}" data-role="point" data-key="${item.key}">
        <div class="sum" data-role="sum" data-key="${item.key}">0</div>`;
      sec.appendChild(row);
    });

    body.appendChild(sec);
  });

  const totalBox = document.createElement("div");
  totalBox.className = "total-box";
  totalBox.innerHTML = `
    <span class="label">Итого баллов ${dept.title}</span>
    <span class="value" id="total-value">0</span>`;
  body.appendChild(totalBox);

  if (profile.dept === "di") {
    const instrBox = document.createElement("div");
    instrBox.className = "total-box";
    instrBox.innerHTML = `
      <span class="label">Действий инструктора</span>
      <span class="value" id="instr-actions-value">0</span>`;
    body.appendChild(instrBox);
  }

  const btns = document.createElement("div");
  btns.className = "buttons";
  btns.innerHTML = `
    <button class="primary" id="btn-copy" type="button">📋 Копировать отчёт</button>
    <button class="danger" id="btn-reset" type="button">↺ Сбросить</button>`;
  body.appendChild(btns);

  const report = document.createElement("div");
  report.className = "report";
  report.id = "report";
  body.appendChild(report);

  body.querySelectorAll("input[type=number]").forEach(inp => {
    inp.addEventListener("input", onInput);
  });
  document.getElementById("btn-copy").addEventListener("click", copyReport);
  document.getElementById("btn-reset").addEventListener("click", resetActive);
}

/* ============================================================
   ВВОД И ПЕРЕСЧЁТ
   ============================================================ */
function onInput(e) {
  const el = e.target;
  const key = el.dataset.key;
  const role = el.dataset.role;
  const profile = getActiveProfile();
  if (!profile) return;

  if (!profile.data[key]) profile.data[key] = {};
  const v = parseInt(el.value, 10);
  profile.data[key][role] = isNaN(v) ? 0 : v;

  saveState();
  recalc();
  showProfileToast();
}

function recalc() {
  const profile = getActiveProfile();
  if (!profile) return;
  const dept = DEPTS[profile.dept];

  let total = 0;
  const reportLines = {};

  dept.sections.forEach((section, sIdx) => {
    reportLines[sIdx] = { title: section.title, lines: [], sum: 0, actionMode: !!section.actionMode };
    section.items.forEach(item => {
      const countEl = document.querySelector(`#dept-body input[data-role="count"][data-key="${item.key}"]`);
      const sumEl   = document.querySelector(`#dept-body div[data-role="sum"][data-key="${item.key}"]`);
      if (!countEl || !sumEl) return;

      let count = parseInt(countEl.value, 10);
      if (isNaN(count)) count = 0;
      const pRaw = parseInt(document.querySelector(`#dept-body input[data-role="point"][data-key="${item.key}"]`).value, 10);
      const point = isNaN(pRaw) ? 0 : pRaw;

      const over = item.lim > 0 && count > item.lim;
      if (over) count = item.lim;
      countEl.classList.toggle("over-limit", over);

      const sum = count * point;
      sumEl.textContent = sum;
      sumEl.classList.toggle("positive", sum > 0);

      const row = countEl.closest(".row");
      row.classList.toggle("active", count > 0);

      if (section.actionMode) {
        reportLines[sIdx].sum += count;
        if (count > 0) reportLines[sIdx].lines.push(`  ${item.name}: ${count} действий`);
      } else {
        total += sum;
        reportLines[sIdx].sum += sum;
        if (count > 0) reportLines[sIdx].lines.push(`  ${item.name}: ${count} × ${point} = ${sum}`);
      }
    });
  });

  const totalEl = document.getElementById("total-value");
  if (totalEl) totalEl.textContent = total;

  if (profile.dept === "di") {
    const instrEl = document.getElementById("instr-actions-value");
    if (instrEl) instrEl.textContent = calcInstrActions(profile);
  }

  const reportEl = document.getElementById("report");
  if (reportEl) {
    let text = "";
    Object.values(reportLines).forEach(sec => {
      if (!sec.lines.length) return;
      text += "── " + sec.title + " ──\n";
      text += sec.lines.join("\n") + "\n";
      text += "  Подытог: " + sec.sum + (sec.actionMode ? " действий" : "") + "\n\n";
    });
    if (total > 0) text += "ИТОГО " + dept.title + ": " + total + " баллов";
    reportEl.textContent = text;
  }

  updateRail("calc-area", total);
  const railTitle = document.getElementById("rail-title");
  if (railTitle) railTitle.textContent = dept.title;
}

/* ============================================================
   КНОПКИ
   ============================================================ */
function copyReport() {
  const el = document.getElementById("report");
  if (!el || !el.textContent) { showToast("Сначала введите данные"); return; }
  const profile = getActiveProfile();
  const header = `=== ОТЧЁТ ${DEPTS[profile.dept].title} · ${profile.name} ===\n\n`;
  navigator.clipboard.writeText(header + el.textContent)
    .then(() => showToast("Отчёт скопирован"))
    .catch(() => showToast("Не удалось скопировать"));
}

function resetActive() {
  const profile = getActiveProfile();
  if (!profile) return;
  askConfirm(
    'Сбросить все данные профиля «' + profile.name + '»?',
    () => {
      profile.data = {};
      saveState();
      renderCalculator();
      recalc();
      showToast("Данные сброшены");
    },
    "Сбросить"
  );
}

/* ============================================================
   ПРОФИЛИ
   ============================================================ */
function addProfile() {
  const name = prompt("Имя нового профиля:", "");
  if (!name || !name.trim()) return;

  let dept = prompt("Отдел (psid / pm / di / had):", "psid");
  if (!dept) return;
  dept = dept.trim().toLowerCase();
  if (!DEPTS[dept]) {
    showToast("Неверный отдел");
    return;
  }

  const p = newProfile(name.trim(), dept);
  state.profiles.push(p);
  state.activeProfileId = p.id;
  saveState();
  renderProfileBar();
  renderCalculator();
  recalc();
  showToast("Профиль добавлен");
}

function renameProfile() {
  const p = getActiveProfile();
  if (!p) return;
  const name = prompt("Новое имя профиля:", p.name);
  if (!name || !name.trim()) return;
  p.name = name.trim();
  saveState();
  renderProfileBar();
  showToast("Профиль переименован");
}

function deleteProfile() {
  const p = getActiveProfile();
  if (!p) return;
  if (state.profiles.length <= 1) {
    showToast("Нельзя удалить последний профиль");
    return;
  }
  askConfirm(
    'Удалить профиль «' + p.name + '» вместе со всеми данными?',
    () => {
      state.profiles = state.profiles.filter(x => x.id !== p.id);
      state.activeProfileId = state.profiles[0].id;
      saveState();
      renderProfileBar();
      renderCalculator();
      recalc();
      showToast("Профиль удалён");
    },
    "Удалить"
  );
}

/* ============================================================
   СВОДКА
   ============================================================ */
function showSummary() {
  const content = document.getElementById("summary-content");
  let html = '<table class="summary-table"><thead><tr>' +
    '<th>Профиль</th><th>Отдел</th><th class="num">Итого</th><th class="num">Норма</th><th>Статус</th>' +
    '</tr></thead><tbody>';

  state.profiles.forEach(p => {
    const dept = DEPTS[p.dept];
    const total = calcTotal(p);
    const norm = NORMS[p.dept] || 0;
    let statusClass = "status-bad";
    let statusText = "Мало";
    if (p.dept === "di") {
      const actions = calcInstrActions(p);
      const instrNorm = dept.instrNorm || 20;
      if (actions >= instrNorm) { statusClass = "status-ok"; statusText = "✅ Выполнено"; }
      else if (actions > 0) { statusClass = "status-low"; statusText = "⚠️ " + actions + " / " + instrNorm + " действ."; }
      else { statusClass = "status-bad"; statusText = "❌ Нет действий"; }
      html += `<tr>
        <td>${p.name}</td>
        <td>${dept.icon} ${dept.title}</td>
        <td class="num">${total}</td>
        <td class="num">${instrNorm} действ.</td>
        <td class="status ${statusClass}">${statusText}</td>
      </tr>`;
    } else {
      if (total >= norm) { statusClass = "status-ok"; statusText = "✅ Выполнено"; }
      else if (total > 0) { statusClass = "status-low"; statusText = "⚠️ " + Math.round(total / norm * 100) + "%"; }
      else { statusClass = "status-bad"; statusText = "❌ Нет данных"; }
      html += `<tr>
        <td>${p.name}</td>
        <td>${dept.icon} ${dept.title}</td>
        <td class="num">${total}</td>
        <td class="num">${norm}</td>
        <td class="status ${statusClass}">${statusText}</td>
      </tr>`;
    }
  });

  html += '</tbody></table>';
  content.innerHTML = html;
  document.getElementById("modal-summary").classList.add("active");
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  document.getElementById("year").textContent = new Date().getFullYear();

  if (!loadState() || !state.profiles.length) {
    const p = newProfile("Основной", "psid");
    state = { profiles: [p], activeProfileId: p.id };
    saveState();
  }
  if (!state.activeProfileId || !state.profiles.find(p => p.id === state.activeProfileId)) {
    state.activeProfileId = state.profiles[0].id;
  }

  renderProfileBar();
  renderCalculator();
  recalc();

  document.getElementById("profile-select").addEventListener("change", (e) => {
    state.activeProfileId = e.target.value;
    saveState();
    renderProfileBar();
    renderCalculator();
    recalc();
  });

  document.getElementById("btn-add-profile").addEventListener("click", addProfile);
  document.getElementById("btn-rename-profile").addEventListener("click", renameProfile);
  document.getElementById("btn-delete-profile").addEventListener("click", deleteProfile);
  document.getElementById("btn-summary").addEventListener("click", showSummary);

  // закрытие модалок
  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.close;
      document.getElementById(id).classList.remove("active");
      if (id === "modal-confirm") confirmCallback = null;
    });
  });
  document.getElementById("modal-summary").addEventListener("click", (e) => {
    if (e.target.id === "modal-summary") e.currentTarget.classList.remove("active");
  });
  document.getElementById("modal-confirm").addEventListener("click", (e) => {
    if (e.target.id === "modal-confirm") closeConfirm();
  });

  // кнопки подтверждения
  document.getElementById("confirm-yes").addEventListener("click", () => {
    const cb = confirmCallback;
    closeConfirm();
    if (cb) cb();
  });
  document.getElementById("confirm-no").addEventListener("click", closeConfirm);

  // переключение отдела
  document.querySelectorAll(".dept-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = getActiveProfile();
      if (!p) return;
      const newDept = btn.dataset.dept;
      if (!DEPTS[newDept]) return;
      if (p.dept === newDept) return;

      askConfirm(
        'Сменить отдел профиля «' + p.name + '» на ' + DEPTS[newDept].title + '?\n\nДанные текущего отдела сохранятся, но не будут отображаться, пока не вернёшься в этот отдел.',
        () => {
          p.dept = newDept;
          saveState();
          renderProfileBar();
          renderCalculator();
          recalc();
        },
        "Сменить"
      );
    });
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      copyReport();
    }
    if (e.key === "Escape") {
      document.getElementById("modal-summary").classList.remove("active");
      closeConfirm();
    }
  });
}

window.onCalcResize = function() { recalc(); };

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
