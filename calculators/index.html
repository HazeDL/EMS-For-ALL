<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор баллов — EMS</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* --------- Левая панель --------- */
  .side-tabs-left {
    position: fixed; top: 50%; left: 0; transform: translateY(-50%);
    z-index: 90; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .tab-left {
    --visible: 56px; --width: 260px;
    position: relative;
    left: calc(-1 * (var(--width) - var(--visible)));
    width: var(--width); height: 62px;
    display: flex; align-items: center;
    gap: 14px; padding: 0 18px;
    background: rgba(22, 27, 34, 0.86); color: var(--text);
    border: 1px solid var(--border); border-left: none;
    border-radius: 0 14px 14px 0;
    font-size: 17px; font-weight: 500; text-align: left;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    transition: left 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.15s, color 0.15s, border-color 0.15s;
    pointer-events: auto; text-decoration: none;
  }
  .tab-left:hover {
    left: 0; background: rgba(30, 38, 52, 0.95);
    color: var(--accent-hover); border-color: var(--accent);
  }
  .tab-left .tab-icon { font-size: 24px; flex-shrink: 0; width: 30px; text-align: center; }
  .tab-left .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --------- Правая панель --------- */
  .side-tabs {
    position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    z-index: 90; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .tab {
    --visible: 52px; --width: 240px;
    position: relative; right: calc(-1 * (var(--width) - var(--visible)));
    width: var(--width); height: 62px; display: flex; align-items: center;
    gap: 14px; padding: 0 18px;
    background: rgba(22, 27, 34, 0.86); color: var(--text);
    border: 1px solid var(--border); border-right: none;
    border-radius: 14px 0 0 14px;
    font-size: 17px; font-weight: 500; text-align: left;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    transition: right 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.15s, color 0.15s, border-color 0.15s;
    pointer-events: auto; text-decoration: none;
  }
  .tab:hover {
    right: 0; background: rgba(30, 38, 52, 0.95);
    color: var(--accent-hover); border-color: var(--accent);
  }
  .tab.tab-active {
    background: rgba(26, 39, 68, 0.92);
    border-color: var(--accent); color: var(--accent);
  }
  .tab.tab-active::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
  }
  .tab-icon { font-size: 24px; flex-shrink: 0; width: 30px; text-align: center; }
  .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --------- Панель сверху --------- */
  .top-bar {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 22px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    justify-content: space-between;
  }

  .current-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 200px;
  }
  .current-profile-icon {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(88, 166, 255, 0.10);
    border: 1px solid rgba(88, 166, 255, 0.25);
    border-radius: 12px;
    font-size: 24px;
    flex-shrink: 0;
  }
  .current-profile-info { min-width: 0; }
  .current-profile-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-profile-dept {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .big-btn {
    background: rgba(13, 17, 23, 0.6);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .big-btn:hover { border-color: var(--accent); color: var(--accent); }
  .big-btn.primary {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
  }
  .big-btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #0d1117;
  }

  /* --------- Модалка --------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9998;
    display: none; align-items: center; justify-content: center;
    background: rgba(5, 8, 12, 0.85);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 24px;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.25s ease;
  }
  .modal-sm { max-width: 460px; }
  @keyframes modalIn {
    from { transform: scale(0.96); opacity: 0.8; }
    to   { transform: scale(1); opacity: 1; }
  }
  .modal-title {
    font-size: 22px; font-weight: 700; color: var(--accent);
    margin-bottom: 20px; display: flex;
    justify-content: space-between; align-items: center;
    gap: 12px;
  }
  .modal-close {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer; line-height: 1;
    padding: 0; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; transition: all 0.15s;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--danger); background: rgba(248, 81, 73, 0.1); }

  .modal-message {
    font-size: 16px; color: var(--text); line-height: 1.6;
    margin-bottom: 22px;
    white-space: pre-wrap;
  }
  .modal-buttons {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  }

  /* --------- Список профилей в модалке --------- */
  .profile-list {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 20px;
  }

  .profile-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(13, 17, 23, 0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.18s, background 0.18s;
  }
  .profile-card:hover { border-color: var(--accent); }
  .profile-card.active {
    border-color: var(--accent);
    background: rgba(26, 39, 68, 0.55);
  }

  .profile-card-icon {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(88, 166, 255, 0.10);
    border: 1px solid rgba(88, 166, 255, 0.22);
    border-radius: 12px;
    font-size: 22px;
    flex-shrink: 0;
  }
  .profile-card-body { flex: 1; min-width: 0; cursor: pointer; }
  .profile-card-name {
    font-size: 16.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-card.active .profile-card-name { color: var(--accent); }
  .profile-card-meta {
    font-size: 13px; color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .profile-card-total {
    color: var(--success);
    font-weight: 600;
  }

  .profile-card-actions {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .mini-btn {
    width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn.danger:hover {
    border-color: var(--danger); color: var(--danger);
    background: rgba(248, 81, 73, 0.06);
  }

  /* --------- Форма нового профиля --------- */
  .new-profile-form {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
    background: rgba(13, 17, 23, 0.5);
    border: 1px dashed var(--accent);
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .new-profile-form.active { display: flex; }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field label {
    font-size: 12px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  }
  .form-field input,
  .form-field select {
    background: rgba(13, 17, 23, 0.7);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .form-field input:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* --------- Inline редактирование имени --------- */
  .profile-rename-input {
    background: rgba(13, 17, 23, 0.8);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    width: 100%;
  }
  .profile-rename-input:focus { outline: none; }

  /* --------- Сводка --------- */
  .summary-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .summary-table th {
    text-align: left; padding: 12px 14px; color: var(--text-dim);
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .summary-table td {
    padding: 14px; border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .summary-table tr:hover td { background: rgba(88, 166, 255, 0.05); }
  .summary-table .num { text-align: right; font-weight: 700; color: var(--accent); }
  .summary-table .status { font-weight: 600; }
  .status-ok   { color: var(--success); }
  .status-low  { color: var(--gold); }
  .status-bad  { color: var(--danger); }

  /* --------- Секции калькулятора --------- */
  .section {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  }
  .section-title {
    font-size: 18px; font-weight: 600; color: var(--text);
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }

  .content-layout {
    display: grid; grid-template-columns: 130px 1fr;
    gap: 26px; align-items: start;
  }

  /* --------- Всплывающий тост --------- */
  .profile-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(26, 39, 68, 0.98);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    opacity: 0;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s;
    pointer-events: none;
    z-index: 3000;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 90vw;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .profile-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .profile-toast .pt-icon { font-size: 20px; }
  .profile-toast .pt-name { color: var(--accent); }
  .profile-toast .pt-total { color: var(--success); margin-left: 6px; }

  @media (max-width: 900px) {
    .content-layout { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .side-tabs-left { top: auto; bottom: 76px; left: 12px; transform: none; }
    .tab-left { --width: 220px; --visible: 52px; height: 54px; font-size: 16px; padding: 0 14px; left: 0; border-radius: 12px; border-left: 1px solid var(--border); }
    .side-tabs { top: auto; bottom: 14px; transform: none; }
    .tab { --width: 190px; --visible: 50px; height: 54px; font-size: 16px; padding: 0 14px; border-radius: 12px; border-right: 1px solid var(--border); right: 0; }
    .tab:hover { right: 0; }

    .top-bar { padding: 12px 14px; gap: 10px; }
    .top-actions { width: 100%; justify-content: stretch; }
    .big-btn { flex: 1; justify-content: center; padding: 10px 12px; font-size: 14px; }

    .modal { padding: 20px; }
    .summary-table { font-size: 14px; }
    .summary-table th, .summary-table td { padding: 10px 8px; }
    .form-row { grid-template-columns: 1fr; }

    .profile-toast { padding: 12px 18px; font-size: 15px; bottom: 90px; }
  }
</style>
</head>
<body>

<nav class="side-tabs-left" aria-label="Навигация">

<div class="container page-content">

  <header>
    <img src="../images/ems-logo.png" alt="EMS" class="ems-logo">
    <h1>Калькулятор баллов</h1>
    <p>PSID · PM · DI · HAD — единый калькулятор с профилями</p>
  </header>

  <!-- ==================== ПАНЕЛЬ СВЕРХУ ==================== -->
  <div class="top-bar">

    <div class="current-profile">
      <div class="current-profile-icon" id="cur-icon">👤</div>
      <div class="current-profile-info">
        <div class="current-profile-name" id="cur-name">—</div>
        <div class="current-profile-dept" id="cur-dept">—</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="big-btn primary" id="btn-profiles" type="button">👥 Профили</button>
      <button class="big-btn" id="btn-summary" type="button">📊 Сводка</button>
    </div>

  </div>

  <!-- ==================== КАЛЬКУЛЯТОР ==================== -->
  <div class="content-layout" id="calc-area">

    <aside class="progress-rail" data-rail="main">
      <div class="progress-rail-title" id="rail-title">PSID</div>
      <div class="progress-rail-value" data-rail-value>0</div>
      <div class="progress-rail-scale">
        <div class="progress-rail-fill" data-rail-fill></div>
        <div class="progress-rail-ticks">
          <div class="progress-rail-tick" style="bottom: 100%;"><span class="progress-rail-tick-label">1500</span></div>
          <div class="progress-rail-tick" style="bottom: 66.66%;"><span class="progress-rail-tick-label">1000</span></div>
          <div class="progress-rail-tick" style="bottom: 33.33%;"><span class="progress-rail-tick-label">500</span></div>
          <div class="progress-rail-tick" style="bottom: 16.66%;"><span class="progress-rail-tick-label">250</span></div>
          <div class="progress-rail-tick" style="bottom: 6.66%;"><span class="progress-rail-tick-label">100</span></div>
        </div>
      </div>
      <div class="progress-rail-status" data-rail-status>Начало</div>
    </aside>

    <div id="dept-body"></div>

  </div>

  <footer>
    Калькулятор баллов EMS · <span id="year"></span> · Профили и отделы
  </footer>

</div>

<!-- ==================== МОДАЛКА ПРОФИЛЕЙ ==================== -->
<div class="modal-overlay" id="modal-profiles">
  <div class="modal">
    <div class="modal-title">
      👥 Профили
      <button class="modal-close" data-close="modal-profiles" type="button">✕</button>
    </div>

    <div class="new-profile-form" id="new-profile-form">
      <div class="form-row">
        <div class="form-field">
          <label>Имя профиля</label>
          <input type="text" id="new-name" placeholder="Например: Иван Петров" maxlength="40">
        </div>
        <div class="form-field">
          <label>Отдел</label>
          <select id="new-dept">
            <option value="psid">🏥 PSID</option>
            <option value="pm">📋 PM</option>
            <option value="di">📊 DI</option>
            <option value="had">💉 HAD</option>
          </select>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="big-btn" id="new-cancel" type="button">Отмена</button>
        <button class="big-btn primary" id="new-create" type="button">Создать</button>
      </div>
    </div>

    <div class="profile-list" id="profile-list"></div>

    <div class="modal-buttons">
      <button class="big-btn primary" id="add-profile-btn" type="button">＋ Новый профиль</button>
    </div>
  </div>
</div>

<!-- ==================== МОДАЛКА СВОДКИ ==================== -->
<div class="modal-overlay" id="modal-summary">
  <div class="modal">
    <div class="modal-title">
      📊 Сводка по всем профилям
      <button class="modal-close" data-close="modal-summary" type="button">✕</button>
    </div>
    <div id="summary-content"></div>
  </div>
</div>

<!-- ==================== МОДАЛКА ПОДТВЕРЖДЕНИЯ ==================== -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-sm">
    <div class="modal-title">
      ⚠️ Подтверждение
      <button class="modal-close" data-close="modal-confirm" type="button">✕</button>
    </div>
    <div class="modal-message" id="confirm-message">Вы уверены?</div>
    <div class="modal-buttons">
      <button class="big-btn" id="confirm-no" type="button">Отмена</button>
      <button class="big-btn primary" id="confirm-yes" type="button">Да</button>
    </div>
  </div>
</div>

<!-- ==================== ТОСТ ПРИ ВВОДЕ ==================== -->
<div class="profile-toast" id="profile-toast">
  <span class="pt-icon">👤</span>
  <span>Считаем для <span class="pt-name" id="pt-name">—</span></span>
  <span class="pt-total" id="pt-total">0</span>
</div>

<div class="toast" id="toast"></div>

const STORAGE_KEY = "ems_calc_profiles_v1";
const NORMS = { psid: 500, pm: 500, di: 500, had: 500 };

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let state = {
  profiles: [],
  activeProfileId: null
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed.profiles || !Array.isArray(parsed.profiles)) return false;
    state = parsed;
    return true;
  } catch (e) { return false; }
}

function newProfile(name, dept) {
  return {
    id: "p" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    name: name,
    dept: dept,
    data: {}
  };
}

function getActiveProfile() {
  return state.profiles.find(p => p.id === state.activeProfileId);
}

/* ============================================================
   МОДАЛКИ
   ============================================================ */
function openModal(id) {
  document.getElementById(id).classList.add("active");
}
function closeModal(id) {
  document.getElementById(id).classList.remove("active");
}

/* --------- Подтверждение --------- */
let confirmCallback = null;
function askConfirm(message, onYes, yesLabel) {
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-yes").textContent = yesLabel || "Да";
  confirmCallback = onYes;
  openModal("modal-confirm");

/* ============================================================
   ТОСТ ПРИ ВВОДЕ
   ============================================================ */
let profileToastTimer = null;
function showProfileToast() {
  const profile = getActiveProfile();
  if (!profile) return;
  const dept = DEPTS[profile.dept];
  const total = calcTotal(profile);

  document.getElementById("pt-name").textContent = profile.name + " · " + dept.title;
  document.getElementById("pt-total").textContent = total + " баллов";

  const el = document.getElementById("profile-toast");
  el.classList.add("show");
  clearTimeout(profileToastTimer);
  profileToastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ============================================================
   РАСЧЁТЫ
   ============================================================ */
function calcTotal(profile) {
  if (!profile) return 0;
  const dept = DEPTS[profile.dept];
  if (!dept) return 0;
  let total = 0;
  dept.sections.forEach(section => {
    if (section.actionMode) return;
    section.items.forEach(item => {
      const d = profile.data[item.key];
      if (!d) return;
      let count = d.count || 0;
      const point = d.point != null ? d.point : item.pts;
      if (item.lim > 0 && count > item.lim) count = item.lim;
      total += count * point;
    });
  });
  return total;
}

function calcInstrActions(profile) {
  if (!profile || profile.dept !== "di") return 0;
  const dept = DEPTS.di;
  const instr = dept.sections.find(s => s.actionMode);
  if (!instr) return 0;
  let actions = 0;
  instr.items.forEach(item => {
    const d = profile.data[item.key];
    if (!d) return;
    actions += d.count || 0;
  });
  return actions;
}

/* ============================================================
   СПИСОК ПРОФИЛЕЙ В МОДАЛКЕ
   ============================================================ */
function renderProfileList() {
  const list = document.getElementById("profile-list");
  list.innerHTML = "";

  if (!state.profiles.length) {
    list.innerHTML = "<p style='color: var(--text-dim); text-align: center; padding: 20px 0;'>Нет профилей. Добавьте первый.</p>";
    return;
  }

  state.profiles.forEach(p => {
    const dept = DEPTS[p.dept];
    const isActive = p.id === state.activeProfileId;
    const total = calcTotal(p);

    const card = document.createElement("div");
    card.className = "profile-card" + (isActive ? " active" : "");
    card.dataset.id = p.id;

    let metaExtra = "";
    if (p.dept === "di") {
      const actions = calcInstrActions(p);
      const instrNorm = dept.instrNorm || 20;
      metaExtra = `<span>🎯 ${actions} / ${instrNorm} действий</span>`;
    } else {
      const norm = NORMS[p.dept] || 0;
      metaExtra = `<span>🎯 норма ${norm}</span>`;
    }

    card.innerHTML = `
      <div class="profile-card-icon">${dept.icon}</div>
      <div class="profile-card-body" data-action="select">
        <div class="profile-card-name">${escapeHtml(p.name)}</div>
        <div class="profile-card-meta">
          <span>${dept.title}</span>
          <span class="profile-card-total">${total} баллов</span>
          ${metaExtra}
        </div>
      </div>
      <div class="profile-card-actions">
        <button class="mini-btn" data-action="rename" title="Переименовать" type="button">✎</button>
        <button class="mini-btn danger" data-action="delete" title="Удалить" type="button">🗑</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* --------- Обработчики списка профилей --------- */
function bindProfileList() {
  const list = document.getElementById("profile-list");
  list.addEventListener("click", (e) => {
    const card = e.target.closest(".profile-card");
    if (!card) return;

    const actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;

    const id = card.dataset.id;
    const action = actionEl.dataset.action;

    if (action === "select") {
      switchProfile(id);
    } else if (action === "rename") {
      startRename(id);
    } else if (action === "delete") {
      askDeleteProfile(id);
    }
  });
}

function switchProfile(id) {
  state.activeProfileId = id;
  saveState();
  closeModal("modal-profiles");
  renderTopBar();
  renderCalculator();
  recalc();
  showToast("Профиль переключён");
}

/* --------- Переименование inline --------- */
function startRename(id) {
  const card = document.querySelector(`.profile-card[data-id="${id}"]`);
  if (!card) return;
  const body = card.querySelector(".profile-card-body");
  const profile = state.profiles.find(p => p.id === id);
  if (!profile) return;

  const oldHtml = body.innerHTML;
  body.innerHTML = `<input class="profile-rename-input" type="text" value="${escapeHtml(profile.name)}" maxlength="40">`;
  const input = body.querySelector("input");
  input.focus();
  input.select();

  const finish = (save) => {
    if (save) {
      const newName = input.value.trim();
      if (newName && newName !== profile.name) {
        profile.name = newName;
        saveState();
        renderTopBar();
        showToast("Имя обновлено");
      }
    }
    renderProfileList();
  };

  input.addEventListener("blur", () => finish(true));
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  });
}

/* --------- Удаление профиля --------- */
function askDeleteProfile(id) {
  const profile = state.profiles.find(p => p.id === id);
  if (!profile) return;
  if (state.profiles.length <= 1) {
    showToast("Нельзя удалить последний профиль");
    return;
  }

  askConfirm(
    'Удалить профиль «' + profile.name + '» вместе со всеми данными?',
    () => {
      state.profiles = state.profiles.filter(x => x.id !== id);
      if (state.activeProfileId === id) {
        state.activeProfileId = state.profiles[0].id;
      }
      saveState();
      renderTopBar();
      renderProfileList();
      renderCalculator();
      recalc();
      showToast("Профиль удалён");
    },
    "Удалить"
  );
}

function renderCalculator() {
  const profile = getActiveProfile();
  const body = document.getElementById("dept-body");
  const railTitle = document.getElementById("rail-title");
  body.innerHTML = "";

  if (!profile) {
    body.innerHTML = "<p style='color: var(--text-dim); text-align:center; padding: 40px 0;'>Нет активного профиля</p>";
    return;
  }

  const dept = DEPTS[profile.dept];
  railTitle.textContent = dept.title;

  dept.sections.forEach(section => {
    const sec = document.createElement("div");
    sec.className = "section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = section.title;
    sec.appendChild(title);

    const header = document.createElement("div");
    header.className = "row header-row";
    header.innerHTML = `
      <div class="cell">Действие</div>
      <div class="cell">Кол-во</div>
      <div class="cell">Балл</div>
      <div class="cell">Итог</div>`;
    sec.appendChild(header);

    section.items.forEach(item => {
      const d = profile.data[item.key] || {};
      const count = d.count != null && d.count > 0 ? d.count : "";
      const point = d.point != null ? d.point : item.pts;

      const row = document.createElement("div");
      row.className = "row";
      row.dataset.key = item.key;

      const badge = item.lim > 0 ? `<span class="limit">макс ${item.lim}</span>` : "";
      row.innerHTML = `
        <div class="name">${item.name}${badge}</div>
        <input type="number" min="0" step="1" value="${count}" data-role="count" data-key="${item.key}">
        <input type="number" min="0" step="1" value="${point}" data-role="point" data-key="${item.key}">
        <div class="sum" data-role="sum" data-key="${item.key}">0</div>`;
      sec.appendChild(row);
    });

    body.appendChild(sec);
  });

  const totalBox = document.createElement("div");
  totalBox.className = "total-box";
  totalBox.innerHTML = `
    <span class="label">Итого баллов ${dept.title}</span>
    <span class="value" id="total-value">0</span>`;
  body.appendChild(totalBox);

  if (profile.dept === "di") {
    const instrBox = document.createElement("div");
    instrBox.className = "total-box";
    instrBox.innerHTML = `
      <span class="label">Действий инструктора</span>
      <span class="value" id="instr-actions-value">0</span>`;
    body.appendChild(instrBox);
  }

  const btns = document.createElement("div");
  btns.className = "buttons";
  btns.innerHTML = `
    <button class="primary" id="btn-copy" type="button">📋 Копировать отчёт</button>
    <button class="danger" id="btn-reset" type="button">↺ Сбросить</button>`;
  body.appendChild(btns);

  const report = document.createElement("div");
  report.className = "report";
  report.id = "report";
  body.appendChild(report);

  body.querySelectorAll("input[type=number]").forEach(inp => {
    inp.addEventListener("input", onInput);
  });
  document.getElementById("btn-copy").addEventListener("click", copyReport);
  document.getElementById("btn-reset").addEventListener("click", resetActive);
}

/* ============================================================
   ВВОД И ПЕРЕСЧЁТ
   ============================================================ */
function onInput(e) {
  const el = e.target;
  const key = el.dataset.key;
  const role = el.dataset.role;
  const profile = getActiveProfile();
  if (!profile) return;

  if (!profile.data[key]) profile.data[key] = {};
  const v = parseInt(el.value, 10);
  profile.data[key][role] = isNaN(v) ? 0 : v;

  saveState();
  recalc();
  showProfileToast();
  renderTopBar();
}

function recalc() {
  const profile = getActiveProfile();
  if (!profile) return;
  const dept = DEPTS[profile.dept];

  let total = 0;
  const reportLines = {};

  dept.sections.forEach((section, sIdx) => {
    reportLines[sIdx] = { title: section.title, lines: [], sum: 0, actionMode: !!section.actionMode };
    section.items.forEach(item => {
      const countEl = document.querySelector(`#dept-body input[data-role="count"][data-key="${item.key}"]`);
      const sumEl   = document.querySelector(`#dept-body div[data-role="sum"][data-key="${item.key}"]`);
      if (!countEl || !sumEl) return;

      let count = parseInt(countEl.value, 10);
      if (isNaN(count)) count = 0;
      const pRaw = parseInt(document.querySelector(`#dept-body input[data-role="point"][data-key="${item.key}"]`).value, 10);
      const point = isNaN(pRaw) ? 0 : pRaw;

      const over = item.lim > 0 && count > item.lim;
      if (over) count = item.lim;
      countEl.classList.toggle("over-limit", over);

      const sum = count * point;
      sumEl.textContent = sum;
      sumEl.classList.toggle("positive", sum > 0);

      const row = countEl.closest(".row");
      row.classList.toggle("active", count > 0);

      if (section.actionMode) {
        reportLines[sIdx].sum += count;
        if (count > 0) reportLines[sIdx].lines.push(`  ${item.name}: ${count} действий`);
      } else {
        total += sum;
        reportLines[sIdx].sum += sum;
        if (count > 0) reportLines[sIdx].lines.push(`  ${item.name}: ${count} × ${point} = ${sum}`);
      }
    });
  });

  const totalEl = document.getElementById("total-value");
  if (totalEl) totalEl.textContent = total;

  if (profile.dept === "di") {
    const instrEl = document.getElementById("instr-actions-value");
    if (instrEl) instrEl.textContent = calcInstrActions(profile);
  }

  const reportEl = document.getElementById("report");
  if (reportEl) {
    let text = "";
    Object.values(reportLines).forEach(sec => {
      if (!sec.lines.length) return;
      text += "── " + sec.title + " ──\n";
      text += sec.lines.join("\n") + "\n";
      text += "  Подытог: " + sec.sum + (sec.actionMode ? " действий" : "") + "\n\n";
    });
    if (total > 0) text += "ИТОГО " + dept.title + ": " + total + " баллов";
    reportEl.textContent = text;
  }

  updateRail("calc-area", total);
}

/* ============================================================
   КНОПКИ КАЛЬКУЛЯТОРА
   ============================================================ */
function copyReport() {
  const el = document.getElementById("report");
  if (!el || !el.textContent) { showToast("Сначала введите данные"); return; }
  const profile = getActiveProfile();
  const header = `=== ОТЧЁТ ${DEPTS[profile.dept].title} · ${profile.name} ===\n\n`;
  navigator.clipboard.writeText(header + el.textContent)
    .then(() => showToast("Отчёт скопирован"))
    .catch(() => showToast("Не удалось скопировать"));
}

function resetActive() {
  const profile = getActiveProfile();
  if (!profile) return;
  askConfirm(
    'Сбросить все данные профиля «' + profile.name + '»?',
    () => {
      profile.data = {};
      saveState();
      renderCalculator();
      recalc();
      renderTopBar();
      showToast("Данные сброшены");
    },
    "Сбросить"
  );
}

/* ============================================================
   СВОДКА
   ============================================================ */
function showSummary() {
  const content = document.getElementById("summary-content");
  let html = '<table class="summary-table"><thead><tr>' +
    '<th>Профиль</th><th>Отдел</th><th class="num">Итого</th><th class="num">Норма</th><th>Статус</th>' +
    '</tr></thead><tbody>';

  state.profiles.forEach(p => {
    const dept = DEPTS[p.dept];
    const total = calcTotal(p);
    const norm = NORMS[p.dept] || 0;
    let statusClass = "status-bad";
    let statusText = "Мало";

    if (p.dept === "di") {
      const actions = calcInstrActions(p);
      const instrNorm = dept.instrNorm || 20;
      if (actions >= instrNorm) { statusClass = "status-ok"; statusText = "✅ Выполнено"; }
      else if (actions > 0) { statusClass = "status-low"; statusText = "⚠️ " + actions + " / " + instrNorm + " действ."; }
      else { statusClass = "status-bad"; statusText = "❌ Нет действий"; }
      html += `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td>${dept.icon} ${dept.title}</td>
        <td class="num">${total}</td>
        <td class="num">${instrNorm} действ.</td>
        <td class="status ${statusClass}">${statusText}</td>
      </tr>`;
    } else {
      if (total >= norm) { statusClass = "status-ok"; statusText = "✅ Выполнено"; }
      else if (total > 0) { statusClass = "status-low"; statusText = "⚠️ " + Math.round(total / norm * 100) + "%"; }
      else { statusClass = "status-bad"; statusText = "❌ Нет данных"; }
      html += `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td>${dept.icon} ${dept.title}</td>
        <td class="num">${total}</td>
        <td class="num">${norm}</td>
        <td class="status ${statusClass}">${statusText}</td>
      </tr>`;
    }
  });

  html += '</tbody></table>';
  content.innerHTML = html;
  openModal("modal-summary");
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  document.getElementById("year").textContent = new Date().getFullYear();

  if (!loadState() || !state.profiles.length) {
    const p = newProfile("Основной", "psid");
    state = { profiles: [p], activeProfileId: p.id };
    saveState();
  }
  if (!state.activeProfileId || !state.profiles.find(p => p.id === state.activeProfileId)) {
    state.activeProfileId = state.profiles[0].id;
  }

  renderTopBar();
  renderProfileList();
  renderCalculator();
  recalc();

  /* --------- Кнопки сверху --------- */
  document.getElementById("btn-profiles").addEventListener("click", () => {
    closeNewProfileForm();
    renderProfileList();
    openModal("modal-profiles");
  });
  document.getElementById("btn-summary").addEventListener("click", showSummary);

  /* --------- Форма нового профиля --------- */
  document.getElementById("add-profile-btn").addEventListener("click", openNewProfileForm);
  document.getElementById("new-cancel").addEventListener("click", closeNewProfileForm);
  document.getElementById("new-create").addEventListener("click", createNewProfile);
  document.getElementById("new-name").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); createNewProfile(); }
  });

  /* --------- Список профилей --------- */
  bindProfileList();

  /* --------- Закрытие модалок --------- */
  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.close;
      closeModal(id);
      if (id === "modal-confirm") confirmCallback = null;
      if (id === "modal-profiles") closeNewProfileForm();
    });
  });
  document.querySelectorAll(".modal-overlay").forEach(overlay => {
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        overlay.classList.remove("active");
        if (overlay.id === "modal-confirm") confirmCallback = null;
        if (overlay.id === "modal-profiles") closeNewProfileForm();
      }
    });
  });

  /* --------- Кнопки подтверждения --------- */
  document.getElementById("confirm-yes").addEventListener("click", () => {
    const cb = confirmCallback;
    closeConfirm();
    if (cb) cb();
  });
  document.getElementById("confirm-no").addEventListener("click", closeConfirm);

  /* --------- Горячие клавиши --------- */
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      copyReport();
    }
    if (e.key === "Escape") {
      document.querySelectorAll(".modal-overlay.active").forEach(m => m.classList.remove("active"));
      confirmCallback = null;
      closeNewProfileForm();
    }
  });
}

window.onCalcResize = function() { recalc(); };
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
